name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Syntaxe et tests Python
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: application/requirements.txt
      - name: Installer les dépendances
        run: python -m pip install --upgrade pip -r application/requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q application tests
      - name: Exécuter les tests unitaires
        run: python -m unittest discover -s tests -v

  kubernetes:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Valider les schémas Kubernetes
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/kubernetes:/manifests:ro"
          ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary /manifests

  terraform:
    name: Formatage et validation Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Vérifier le formatage
        run: terraform fmt -check
        working-directory: foundation
      - name: Initialiser sans stockage d’état distant
        run: terraform init -backend=false
        working-directory: foundation
      - name: Valider la configuration
        run: terraform validate
        working-directory: foundation

  docker:
    name: Configuration et construction des images Docker
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Valider la configuration Compose
        run: docker compose config --quiet
      - name: Construire les images de l’application
        run: docker compose build
